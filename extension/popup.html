<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; width: 320px; background: #1f1e1d; color: #f0eee6; }
  main { padding: 14px; display: grid; gap: 10px; }
  h1 { font-size: 14px; margin: 0; display: flex; gap: 8px; align-items: center; }
  .logo { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 8px; background: #2a2927; }
  .logo svg { width: 20px; height: 20px; }
  .swatches { display: flex; gap: 4px; }
  .swatches span { width: 22px; height: 22px; border-radius: 5px; border: 1px solid #0004; }
  .strip { height: 14px; border-radius: 3px; background-repeat: repeat-x; background-size: auto 14px; }
  .muted { color: #a3a097; }
  textarea { width: 100%; box-sizing: border-box; min-height: 64px; background: #141413; color: inherit; border: 1px solid #3a3936; border-radius: 6px; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; }
  button { flex: 1; padding: 7px; border-radius: 6px; border: 0; background: #d97757; color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #3a3936; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<main>
  <h1><span class="logo" id="logo"></span><span id="title">Skinshift</span></h1>
  <div id="status" class="muted">Open a project on claude.ai.</div>
  <div class="swatches" id="swatches"></div>
  <div class="strip" id="strip"></div>
  <div id="glyphs" style="font-size:20px"></div>
  <textarea id="idea" placeholder="Describe the project's look, or leave empty to use its first prompt"></textarea>
  <div class="row">
    <button id="design">/design</button>
    <button id="off" class="secondary">Turn off here</button>
  </div>
  <a href="options.html" target="_blank" class="muted">Settings (API key, model)</a>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
