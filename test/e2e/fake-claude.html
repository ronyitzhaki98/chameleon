<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<title>Claude (test double)</title>
<!-- A stand-in for claude.ai used by the end-to-end test: same token names
     (HSL triplets on :root), same URL shapes, client-side navigation. -->
<style>
  :root {
    --bg-000: 60 2.1% 18.4%; --bg-100: 60 2.7% 14.5%; --bg-200: 30 3.3% 11.8%; --bg-300: 60 2.6% 7.6%;
    --text-000: 48 33.3% 97.1%; --text-100: 48 33.3% 97.1%; --text-200: 50 9% 73.7%; --text-300: 48 4.8% 59.2%;
    --border-300: 60 9.1% 82.2%; --accent-main-100: 15.1 63.1% 59.6%; --accent-brand: 15 63.1% 59.6%;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: hsl(var(--bg-100)); color: hsl(var(--text-100)); display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  nav { background: hsl(var(--bg-200)); padding: 18px 12px; border-right: 1px solid hsl(var(--border-300) / .15); }
  nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: hsl(var(--text-300)); margin: 18px 8px 6px; }
  nav a { display: block; padding: 7px 10px; border-radius: 8px; color: hsl(var(--text-200)); text-decoration: none; }
  nav a:hover, nav a.on { background: hsl(var(--bg-000)); color: hsl(var(--text-000)); }
  main { display: flex; flex-direction: column; padding: 28px 48px; gap: 16px; overflow: auto; }
  .crumb { color: hsl(var(--text-300)); font-size: 13px; }
  .msg { max-width: 720px; }
  .human { background: hsl(var(--bg-300)); padding: 12px 16px; border-radius: 12px; align-self: flex-end; }
  .composer { margin-top: auto; background: hsl(var(--bg-000)); border: 1px solid hsl(var(--border-300) / .15); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .composer .input { flex: 1; outline: none; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .composer .input:empty::before { content: attr(data-placeholder); color: hsl(var(--text-300)); }
  .send { background: hsl(var(--accent-main-100)); color: white; border: 0; border-radius: 10px; padding: 8px 14px; }
  hr { border: 0; border-top: 1px solid hsl(var(--border-300) / .2); width: 100%; }
  code { background: hsl(var(--bg-300)); padding: 2px 6px; border-radius: 5px; color: hsl(var(--accent-brand)); }
</style>
</head>
<body>
<nav>
  <a href="/new">+ New chat</a>
  <h2>Projects</h2>
  <a href="/project/11111111-1111-4111-8111-111111111111">Video editor app</a>
  <a href="/project/22222222-2222-4222-8222-222222222222">Day trading app</a>
  <h2>Recents</h2>
  <a href="/chat/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa">Timeline scrubbing</a>
  <a href="/chat/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb">Order book feed</a>
  <a href="/chat/dddddddd-dddd-4ddd-8ddd-dddddddddddd">Theme design</a>
  <a href="/chat/cccccccc-cccc-4ccc-8ccc-cccccccccccc">Random question</a>
</nav>
<main id="main"></main>
<script>
  const chats = {
    'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa': ['Video editor app', 'How should the timeline handle scrubbing at 60fps?'],
    'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb': ['Day trading app', 'Stream the order book over a websocket.'],
    'cccccccc-cccc-4ccc-8ccc-cccccccccccc': [null, 'What is the capital of Peru?'],
    'dddddddd-dddd-4ddd-8ddd-dddddddddddd': ['Video editor app', 'Design a Chameleon theme for this project'],
  }
  function render() {
    const p = location.pathname
    const chat = chats[p.split('/')[2]]
    const project = p.startsWith('/project/') ? (p.includes('1111') ? 'Video editor app' : 'Day trading app') : chat && chat[0]
    document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === p))
    document.getElementById('main').innerHTML = `
      <div class="crumb">${project ? `Projects / ${project}` : 'Chats'}</div>
      <hr>
      ${chat ? `<div class="msg human">${chat[1]}</div><div class="msg">Here's an approach. Use <code>requestAnimationFrame</code> and keep the work off the main thread.</div><hr role="separator">` : `<div class="msg">${project || 'Start a chat'}</div>`}
      <div class="composer"><div class="input" contenteditable="true" data-placeholder="Reply to Claude…"></div><button class="send">Send</button></div>`
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a')
    if (!a) return
    e.preventDefault()
    history.pushState({}, '', a.getAttribute('href'))
    render()
  })
  render()
</script>
</body>
</html>
